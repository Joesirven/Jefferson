[project]
name = "jefferson-backend"
version = "0.1.0"
description = "Jefferson AI voter simulation backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "asyncpg>=0.30.0",
    "prefect>=3.0.0",
    "pydantic>=2.10.0",
    "click>=8.1.0",
    "aiohttp>=3.11.0",
    "beautifulsoup4>=4.12.0",
    "census>=0.8.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "zhipuai>=0.1.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
analytics = [
    "duckdb>=1.1.0",
    "dbt-duckdb>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
