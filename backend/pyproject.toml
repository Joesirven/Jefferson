[project]
name = "jefferson"
version = "0.1.0"
description = "Jefferson AI - Synthetic Voter Simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "supabase>=2.10.0",
    "prefect>=3.0.0",
    "pydantic>=2.10.0",
    "click>=8.1.0",
    "aiohttp>=3.11.0",
    "beautifulsoup4>=4.12.0",
    "census>=0.8.0",
    "pandas>=2.2.0",
    "zhipuai>=0.1.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
jefferson = "src.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
